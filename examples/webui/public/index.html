<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>decidr-ts showcase</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: "#0b0d12",
          panel: "#12151d",
          panel2: "#171b26",
          border: "#232838",
          dim: "#8890a6",
          accent: "#6ee7b7",
          accent2: "#60a5fa",
          danger: "#f87171",
          warn: "#fbbf24",
        },
        fontFamily: {
          mono: ["SF Mono", "ui-monospace", "Menlo", "Consolas", "monospace"],
        },
      },
    },
  };
</script>
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.7s linear infinite; }
  .bar-fill { transition: width 700ms cubic-bezier(0.16, 1, 0.3, 1); }
</style>
</head>
<body class="m-0 bg-bg text-slate-100 font-sans flex min-h-screen">
  <aside class="w-[300px] shrink-0 bg-panel border-r border-border p-5 flex flex-col gap-4 overflow-y-auto">
    <h1 class="text-base font-semibold flex items-center gap-2 m-0">
      <span class="w-2 h-2 rounded-full bg-accent shadow-[0_0_8px_#6ee7b7]"></span>
      decidr-ts
    </h1>
    <div class="text-xs text-dim -mt-3">Typed decisions from an LLM in one forward pass.</div>

    <div class="bg-panel2 border border-border rounded-xl p-3 text-xs">
      <label for="api-key" class="block mb-1.5 text-dim">OpenAI API key</label>
      <input id="api-key" type="password" placeholder="sk-..." autocomplete="off"
        class="w-full bg-bg border border-border rounded-md text-slate-100 px-2 py-2 font-mono text-xs focus:outline-none focus:border-accent" />
      <div id="key-status" class="mt-1.5 text-[11px]"></div>
      <div class="mt-2 text-dim leading-relaxed">
        Stays in this tab's memory only. Every call goes straight from your
        browser to <code class="font-mono">api.openai.com</code> -- nothing is
        sent anywhere else, including to us. This page is fully static (see
        <a href="https://github.com/devanmolsharma/decidr-ts" class="text-accent2 hover:underline">source</a>).
      </div>
    </div>

    <nav id="nav" class="flex flex-col gap-1 overflow-y-auto"></nav>
  </aside>
  <main id="main" class="flex-1 px-10 py-8 overflow-y-auto max-w-[980px]"></main>

  <script type="module" src="./app.js"></script>
</body>
</html>
